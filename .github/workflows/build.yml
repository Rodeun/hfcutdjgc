# 이 파일 하나만 저장소에 올리면 됩니다. (경로: .github/workflows/build.yml)
# 플러그인 소스(pom.xml, plugin.yml, 자바 코드)를 빌드할 때 이 파일이 직접 만들어서 사용합니다.
name: Build AnvilCostFix

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Create project files
        run: |
          set -e
          mkdir -p proj && cd proj
          mkdir -p src/main/java/com/example/anvilcostfix src/main/resources
          cat > pom.xml <<'__EOF__'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <groupId>com.example</groupId>
              <artifactId>AnvilCostFix</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>

              <properties>
                  <maven.compiler.source>25</maven.compiler.source>
                  <maven.compiler.target>25</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <!-- AnvilView는 1.21 이상 API가 필요합니다. 서버 버전에 맞게 수정하세요. -->
                      <version>1.21.4-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>
          </project>
          __EOF__
          cat > src/main/resources/plugin.yml <<'__EOF__'
          name: AnvilCostFix
          version: 1.0.0
          main: com.example.anvilcostfix.AnvilCostFix
          api-version: "1.21"
          folia-supported: true
          description: Removes the anvil prior-work penalty and the "Too Expensive!" limit.
          commands:
            anvilcostfix:
              description: Reload the config
              usage: /anvilcostfix reload
              permission: anvilcostfix.admin
          permissions:
            anvilcostfix.admin:
              default: op
          __EOF__
          cat > src/main/resources/config.yml <<'__EOF__'
          # 모루로 작업한 아이템에 누적되는 '이전 작업 횟수' 패널티를 새로 만들지 않음
          # (결과물의 repair cost를 항상 0으로 초기화)
          reset-result-penalty: true

          # 이미 패널티가 쌓인 아이템도 그 패널티만큼 비용을 깎아서 계산
          # (기존 아이템도 처음 수리하는 것처럼 비용이 나옴)
          ignore-existing-penalty: true

          # "너무 비쌈!"(40레벨 이상) 제한 제거
          remove-too-expensive: true
          __EOF__
          cat > src/main/java/com/example/anvilcostfix/AnvilCostFix.java <<'__EOF__'
          package com.example.anvilcostfix;

          import org.bukkit.command.Command;
          import org.bukkit.command.CommandSender;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.inventory.InventoryOpenEvent;
          import org.bukkit.event.inventory.PrepareAnvilEvent;
          import org.bukkit.inventory.AnvilInventory;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.inventory.meta.ItemMeta;
          import org.bukkit.inventory.meta.Repairable;
          import org.bukkit.inventory.view.AnvilView;
          import org.bukkit.plugin.java.JavaPlugin;

          public class AnvilCostFix extends JavaPlugin implements Listener {

              private boolean resetResultPenalty;
              private boolean ignoreExistingPenalty;
              private boolean removeTooExpensive;

              @Override
              public void onEnable() {
                  saveDefaultConfig();
                  loadSettings();
                  getServer().getPluginManager().registerEvents(this, this);
              }

              private void loadSettings() {
                  reloadConfig();
                  resetResultPenalty = getConfig().getBoolean("reset-result-penalty", true);
                  ignoreExistingPenalty = getConfig().getBoolean("ignore-existing-penalty", true);
                  removeTooExpensive = getConfig().getBoolean("remove-too-expensive", true);
              }

              /** 모루를 열 때 최대 비용 제한을 먼저 풀어 둔다 (첫 계산부터 '너무 비쌈'이 안 뜨게). */
              @EventHandler
              public void onOpen(InventoryOpenEvent event) {
                  if (removeTooExpensive && event.getView() instanceof AnvilView view) {
                      view.setMaximumRepairCost(Integer.MAX_VALUE);
                  }
              }

              @EventHandler
              public void onPrepare(PrepareAnvilEvent event) {
                  AnvilView view = event.getView();
                  AnvilInventory inv = event.getInventory();

                  if (removeTooExpensive) {
                      view.setMaximumRepairCost(Integer.MAX_VALUE);
                  }

                  ItemStack result = event.getResult();
                  if (result == null || result.getType().isAir()) return;

                  // 1) 결과물에 패널티가 쌓이지 않게 0으로 초기화
                  if (resetResultPenalty) {
                      ItemMeta meta = result.getItemMeta();
                      if (meta instanceof Repairable repairable) {
                          repairable.setRepairCost(0);
                          result.setItemMeta(meta);
                          event.setResult(result);
                      }
                  }

                  // 2) 재료에 이미 쌓인 패널티를 비용에서 제외
                  if (ignoreExistingPenalty) {
                      int penalty = penaltyOf(inv.getFirstItem()) + penaltyOf(inv.getSecondItem());
                      if (penalty > 0) {
                          view.setRepairCost(Math.max(1, view.getRepairCost() - penalty));
                      }
                  }
              }

              private static int penaltyOf(ItemStack item) {
                  if (item == null || item.getType().isAir()) return 0;
                  ItemMeta meta = item.getItemMeta();
                  return meta instanceof Repairable r ? r.getRepairCost() : 0;
              }

              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (args.length == 1 && args[0].equalsIgnoreCase("reload")) {
                      loadSettings();
                      sender.sendMessage("AnvilCostFix 설정을 다시 불러왔습니다.");
                      return true;
                  }
                  return false;
              }
          }
          __EOF__

      - name: Build with Maven
        working-directory: proj
        run: mvn -B clean package

      - name: Show jar contents
        working-directory: proj
        run: |
          ls -l target/*.jar
          unzip -l target/AnvilCostFix-1.0.0.jar
          unzip -l target/AnvilCostFix-1.0.0.jar | grep -q "plugin.yml"
          unzip -l target/AnvilCostFix-1.0.0.jar | grep -q "AnvilCostFix.class"

      - uses: actions/upload-artifact@v4
        with:
          name: AnvilCostFix-jar
          path: proj/target/AnvilCostFix-1.0.0.jar

      - name: Attach jar to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: proj/target/AnvilCostFix-1.0.0.jar
